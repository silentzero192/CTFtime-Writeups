<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="CTF Challenge - Can you find the hidden flag?">
    <title>CTF Challenge - Stego</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #23272A url('images/background.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 800px;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
            }
            to {
                text-shadow: 0 0 30px rgba(88, 101, 242, 0.8), 0 0 40px rgba(88, 101, 242, 0.6);
            }
        }

        .challenge-text {
            font-size: 1.8em;
            margin-top: 40px;
            color: #dcddde;
            line-height: 1.6;
            font-weight: 500;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: #72767d;
            font-size: 0.9em;
        }

        .hint {
            margin-top: 60px;
            font-size: 0.95em;
            color: #72767d;
            font-style: italic;
        }

        /* Hidden easter egg */
        .secret {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CTF CHALLENGE</h1>
        <div class="challenge-text">
            Where do you think your flag is??<br>
            just try to find it
        </div>
        <div class="hint">
            no hint's for the question<br>
            ticket = close ur ticket<br>
            have fun ಥ_ಥ
        </div>
    </div>

    <div class="footer">
        Stego | CTF Challenge
    </div>

    <!-- Nothing to see here... or is there? -->
    <div class="secret">
        <!-- Keep looking... -->
    </div>
</body>
</html>
